er;padding:34px 18px;position:relative;z-index:3}.stage-card{width:min(760px,100%);padding:30px;border-radius:34px;background:rgba(255,255,255,.82);border:1px solid #eee0e9;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.stage-card h2{font-family:'Playfair Display',serif;font-size:clamp(34px,7vw,58px);margin:12px 0}.stage-card p{color:var(--muted);line-height:1.7}.game-options{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:24px 0}.game-choice{font-size:35px;width:70px;height:70px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(60,35,55,.08);transition:.15s}.game-choice:active{transform:scale(.9)}.game-note{min-height:28px;color:#b24f79;font-weight:700}.reveal{padding:30px 0 60px;text-align:center}.reveal h1{font-size:clamp(48px,10vw,105px)}.wish{max-width:780px;margin:25px auto;text-align:left}.wish p{font-size:18px;line-height:1.9;color:#4e4550;margin:0 0 20px}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:28px auto;max-width:760px}.photo{background:#fff;padding:10px 10px 28px;box-shadow:0 18px 45px rgba(80,45,70,.13);transform:rotate(-1deg);border-radius:5px}.photo:nth-child(2){transform:rotate(1.3deg)}.photo img{width:100%;aspect-ratio:1/1;object-fit:cover}.photo small{display:block;margin-top:10px;color:#8e7d89}.wishes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:30px auto;max-width:780px}.wishlet{padding:22px;border-radius:22px;background:#fff;border:1px solid var(--line);text-align:left;line-height:1.65}.last{margin:45px auto 0;max-width:780px}.last-content{display:none;margin-top:20px;animation:rise .5s ease}.last-content.show{display:block}.controls{position:fixed;right:14px;top:14px;z-index:20;display:flex;gap:7px;align-items:center}.settings{position:fixed;right:14px;top:14px;z-index:25}.settings-panel{display:none;margin-top:8px;width:230px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.settings-panel.show{display:block}.settings-panel label{display:block;font-size:12px;font-weight:700;margin:10px 0 6px}.settings-panel input[type=range]{width:100%}.settings-btn{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:13px;box-shadow:0 8px 20px rgba(80,40,70,.08)}.ctrl{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12px}.confetti{position:fixed;top:-20px;width:9px;height:16px;z-index:50;animation:confetti 2.6s ease-in forwards}.balloon{position:fixed;bottom:-100px;font-size:60px;z-index:4;animation:balloon 5s ease-in forwards}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff8fc;z-index:100}.spinner{width:42px;height:42px;border:4px solid #eadce6;border-top-color:#ef7eaa;border-radius:50%;animation:spin .8s linear infinite}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float{to{transform:translateY(-120vh) rotate(30deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes confetti{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@keyframes balloon{to{transform:translateY(-120vh) translateX(var(--x));opacity:0}}

<body><div class="app" id="app"></div><div class="grain"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={sound:true,music:true,volume:.16,musicTimer:null,audioCtx:null,musicGain:null,form:{nicknames:[],tones:[],langs:['en'],emojis:[],photos:[]}};
const EMOJIS=['🐱','🐈','🐶','🐻','🐼','🦊','🐰','🐹','🐨','🐯','🐸','🐥','❤️','🩷','🧡','💛','💚','🩵','💙','💜','🤍','🖤','🤎','💖','💗','💓','💕','💞','💘','🥹','😭','🥺','🫶🏻','🤭','🤌🏻','✨','🌸','🌷','🫠','🎂','🎉','🎊','🥳','🎈','🪅','🎁','🕯️','⭐','🌟','💫','🌙','🌈','☀️','🍀','🦋','🍓','🍰','🎀'];
const TONES=['Cute 🥹','Emotional 💖','Funny 😂','Wholesome 🌷','Sweet 🫶🏻','Playful 😭','Romantic ❤️','Best-friend chaos 🤡','Calm & heartfelt ✨'];
const REL=['Sister','Brother','Best Friend','Friend','Boyfriend','Girlfriend','Crush','Cousin','Mother','Father','Daughter','Son','Partner','Wife','Husband','Classmate','Colleague','Other'];
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function audioReady(){try{state.audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(state.audioCtx.state==='suspended')state.audioCtx.resume();return true}catch{return false}}
function clickSound(freq=440,dur=.08){if(!state.sound||!audioReady())return;const o=state.audioCtx.createOscillator(),g=state.audioCtx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(state.audioCtx.destination);g.gain.setValueAtTime(.0001,state.audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.045*state.volume,state.audioCtx.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,state.audioCtx.currentTime+dur);o.start();o.stop(state.audioCtx.currentTime+dur)}
function startMusic(){if(!state.music||!audioReady()||state.musicTimer)return;const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];let n=0;state.musicTimer=setInterval(()=>{if(!state.music)return;const o=state.audioCtx.createOscillator(),g=state.audioCtx.createGain();o.type='sine';o.frequency.value=notes[n++%notes.length];o.connect(g);g.connect(state.audioCtx.destination);const t=state.audioCtx.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.018*state.volume,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+1.15);o.start(t);o.stop(t+1.2)},1000)}
function stopMusic(){if(state.musicTimer){clearInterval(state.musicTimer);state.musicTimer=null}}
function toggleMusic(){state.music=!state.music;if(state.music)startMusic();else stopMusic();updateControls()}
function updateControls(){document.querySelectorAll('[data-music]').forEach(b=>b.textContent=b.dataset[state.music?'on':'off']||'🎵 Music '+(state.music?'On':'Off'));document.querySelectorAll('[data-sound]').forEach(b=>b.textContent=b.dataset[state.sound?'on':'off']||(state.sound?'🔊 Sounds On':'🔇 Sounds Off'));document.querySelectorAll('[data-volume]').forEach(x=>x.value=Math.round(state.volume*100))}
function controlsHTML(lang='en'){const c={en:{musicOn:'🎵 Music On',musicOff:'🎵 Music Off',soundOn:'🔊 Sounds On',soundOff:'🔇 Sounds Off',volume:'Music volume'},hi:{musicOn:'🎵 संगीत चालू',musicOff:'🎵 संगीत बंद',soundOn:'🔊 साउंड चालू',soundOff:'🔇 साउंड बंद',volume:'संगीत की आवाज़'},hing:{musicOn:'🎵 Music chalu',musicOff:'🎵 Music band',soundOn:'🔊 Sounds chalu',soundOff:'🔇 Sounds band',volume:'Music volume'}}[lang]||{musicOn:'🎵 Music On',musicOff:'🎵 Music Off',soundOn:'🔊 Sounds On',soundOff:'🔇 Sounds Off',volume:'Music volume'};return `<div class="settings"><button class="settings-btn" id="settingsBtn" aria-label="Settings">⚙️</button><div class="settings-panel" id="settingsPanel"><button class="ctrl" data-music data-on="${esc(c.musicOn)}" data-off="${esc(c.musicOff)}" style="width:100%">${c.musicOn}</button><button class="ctrl" data-sound data-on="${esc(c.soundOn)}" data-off="${esc(c.soundOff)}" style="width:100%;margin-top:7px">${c.soundOn}</button><label>${c.volume}</label><input data-volume type="range" min="0" max="100" value="16"></div></div>`}
function bindControls(){const b=$('#settingsBtn'),p=$('#settingsPanel');if(b)b.onclick=()=>p.classList.toggle('show');document.querySelectorAll('[data-music]').forEach(x=>x.onclick=toggleMusic);document.querySelectorAll('[data-sound]').forEach(x=>x.onclick=()=>{state.sound=!state.sound;updateControls();if(state.sound)clickSound(520)});document.querySelectorAll('[data-volume]').forEach(x=>x.oninput=e=>{state.volume=+e.target.value/100});updateControls()}
document.addEventListener('pointerdown',()=>{if(state.music)startMusic()},{once:false});
function codeFor(obj){const raw=JSON.stringify(obj);let b='';for(let i=0;i<raw.length;i++)b+=String.fromCharCode(raw.charCodeAt(i)^17);return 'WB-'+btoa(unescape(encodeURIComponent(b))).replace(/[^A-Za-z0-9]/g,'').slice(0,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
async function pack(obj){const raw=JSON.stringify(obj);try{if('CompressionStream' in window){const cs=new CompressionStream('deflate');const w=cs.writable.getWriter();w.write(new TextEncoder().encode(raw));w.close();const bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}}catch{}return btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function unpack(s){try{const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if('DecompressionStream' in window){const ds=new DecompressionStream('deflate');const w=ds.writable.getWriter();w.write(bytes);w.close();const raw=await new Response(ds.readable).text();return JSON.parse(raw)}const b=decodeURIComponent(escape(bin));return JSON.parse(b)}catch{try{const b=decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));return JSON.parse(b)}catch{return null}}}
function currentBase(){const live='https://shivaayu.github.io/WishBloom/';return /^https?:$/i.test(location.protocol)?location.origin+location.pathname:live}
async function saveWish(data){const id=await pack(data);const code='WB-'+id;return {code,id,url:currentBase()+'#wish='+id}}
function renderHome(){document.title='WishBloom · Birthday wishes made personal';$('#app').innerHTML=`<div class="floaters">${['🌸','✨','💗','⭐','🌷'].map((e,i)=>`<span class="floater" style="left:${10+i*20}%;animation-delay:${i*1.2}s">${e}</span>`).join('')}</div>${controlsHTML()}<main><div class="container"><nav class="nav"><div><div class="brand"><span>WishBloom</span></div><div class="nav-credit">by Shivaayu</div></div></nav><section class="hero"><div class="eyebrow">a tiny corner made for someone's big day ✨</div><h1>Wish<span>Bloom</span></h1><p>A tiny little place to make someone’s birthday feel extra special. 🌷</p><div class="actions"><button class="btn primary" id="create">💌 Create a Wish</button><button class="btn soft" id="have">🔐 I Have a Code</button></div></section><section class="section"><h2>How it works</h2><p class="sub">A few little details from you. A whole little moment for them.</p><div class="steps">${[['01','Create their wish 💌','Tell us a little about the person you’re celebrating.'],['02','Add the little details ✨','Choose their language, vibe, memories and little favourites.'],['03','Get their secret link 🔐','WishBloom prepares a private birthday surprise to share.'],['04','Send it to them 🎁','They open the link and step into their little birthday moment.']].map(x=>`<article class="step"><div class="num">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></section><footer class="footer"><strong>Created by Shivaayu</strong><br><span>made with love ♡</span><div style="margin-top:9px"><a href="https://instagram.com/Pvt_Shivaayu" target="_blank" rel="noopener">Instagram · @Pvt_Shivaayu</a><br><a href="https://instagram.com/Selfish_Senpaiii" target="_blank" rel="noopener">Instagram · @Selfish_Senpaiii</a></div></footer></div></main>`;bindControls();$('#create').onclick=()=>{startMusic();openForm()};$('#have').onclick=()=>openCode();}
function openCode(){const m=document.createElement('div');m.className='modal show';document.body.classList.add('modal-open');m.innerHTML=`<div class="sheet"><div class="sheet-head"><div><div class="tiny">WELCOME BACK</div><h2 style="font-family:'Playfair Display';margin:6px 0">Have a WishBloom surprise? 🔐</h2><p class="sub">Paste the complete link or the full share token here. Short reference codes cannot recreate a wish on a static site, so this token contains the wish itself.</p></div><button class="close">×</button></div><div class="field"><label>WishBloom link or share token</label><input id="codeInput" placeholder="https://shivaayu.github.io/WishBloom/#wish=…" autocomplete="off"></div><div class="navbuttons"><span></span><button class="btn primary" id="openCodeBtn">Open the surprise →</button></div></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>{m.remove();document.body.classList.remove('modal-open')};m.querySelector('#openCodeBtn').onclick=async()=>{const value=m.querySelector('#codeInput').value.trim();try{let id='';if(/^WB-/i.test(value)&&!/^https?:/i.test(value)){id=value.slice(3)}else{const u=new URL(value);id=new URLSearchParams(u.hash.replace(/^#/,'')).get('wish')||u.searchParams.get('wish')||''}if(!id)throw 0;const data=await unpack(id);if(!data||!data.name)throw 0;m.remove();document.body.classList.remove('modal-open');renderRecipient(data)}catch{toast('Please paste the complete WishBloom link or full share token 🔗')}};}
function cropImage(file){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onerror=()=>resolve(null);im.onload=()=>{let zoom=1,ox=0,oy=0,dragging=false,lastX=0,lastY=0;const modal=document.createElement('div');modal.className='crop-modal';modal.innerHTML=`<div class="crop-sheet"><div class="tiny">PHOTO CROP</div><h3 style="margin:6px 0">Make it fit perfectly ✨</h3><p class="sub">A square crop, just like an Instagram profile picture. Drag the photo to place it and use + / − to zoom.</p><div class="crop-frame"><canvas id="cropCanvas" width="600" height="600"></canvas></div><div class="crop-controls"><button class="zoom-btn" id="zoomOut" aria-label="Zoom out">−</button><div class="zoom-readout" id="zoomReadout">100%</div><button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button></div><div class="crop-actions"><button class="btn soft" id="cropCancel">Cancel</button><button class="btn primary" id="cropDone">Use this crop ✓</button></div></div>`;document.body.append(modal);const c=modal.querySelector('#cropCanvas'),ctx=c.getContext('2d');const W=c.width,H=c.height;function bounds(){const base=Math.min(im.naturalWidth,im.naturalHeight);const side=base/zoom;return{side,maxX:Math.max(0,im.naturalWidth-side),maxY:Math.max(0,im.naturalHeight-side)}}function clamp(){const b=bounds();ox=Math.max(0,Math.min(b.maxX,ox));oy=Math.max(0,Math.min(b.maxY,oy))}function draw(){clamp();const b=bounds();ctx.clearRect(0,0,W,H);ctx.drawImage(im,ox,oy,b.side,b.side,0,0,W,H);modal.querySelector('#zoomReadout').textContent=Math.round(zoom*100)+'%'}function setZoom(next,cx=W/2,cy=H/2){const old=bounds();const beforeX=ox+(cx/W)*old.side;const beforeY=oy+(cy/H)*old.side;zoom=Math.max(1,Math.min(4,next));const after=bounds();ox=beforeX-(cx/W)*after.side;oy=beforeY-(cy/H)*after.side;draw()}function pointerPos(e){const rr=c.getBoundingClientRect();return{x:(e.clientX-rr.left)*(W/rr.width),y:(e.clientY-rr.top)*(H/rr.height)}}c.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;c.classList.add('dragging');c.setPointerCapture?.(e.pointerId);e.preventDefault()});c.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;const rr=c.getBoundingClientRect(),b=bounds();ox-=dx*(W/rr.width)*(b.side/W);oy-=dy*(H/rr.height)*(b.side/H);draw();e.preventDefault()});const stop=()=>{dragging=false;c.classList.remove('dragging')};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);c.addEventListener('wheel',e=>{e.preventDefault();const pt=pointerPos(e);setZoom(zoom+(e.deltaY<0?.12:-.12),pt.x,pt.y)},{passive:false});modal.querySelector('#zoomIn').onclick=()=>setZoom(zoom+.15);modal.querySelector('#zoomOut').onclick=()=>setZoom(zoom-.15);draw();modal.querySelector('#cropCancel').onclick=()=>{modal.remove();resolve(null)};modal.querySelector('#cropDone').onclick=()=>{const out=document.createElement('canvas');out.width=360;out.height=360;const o=out.getContext('2d'),b=bounds();o.drawImage(im,ox,oy,b.side,b.side,0,0,600,600);modal.remove();resolve(out.toDataURL('image/jpeg',.55))}};im.src=r.result};r.onerror=()=>resolve(null);r.readAsDataURL(file)})}
function openForm(){let step=0;const f={name:'',nicknames:[],rel:'Friend',customRel:'',gender:'',langs:['en'],tones:['Wholesome 🌷'],emojis:['✨','💗','🎂'],customEmoji:'',photos:[],date:'',age:'',colour:'',animal:'',hobby:'',song:'',message:''};const m=document.createElement('div');m.className='modal show';document.body.classList.add('modal-open');m.innerHTML=`<div class="sheet"><div class="sheet-head"><div><div class="tiny">CREATE A LITTLE SURPRISE</div><h2 style="font-family:'Playfair Display';margin:6px 0">Let’s make it feel like them. 🌷</h2></div><button class="close">×</button></div><div class="progress"><i id="prog"></i></div><div id="formSteps">
<section class="stepview active"><div class="tiny">STEP 1 OF 5</div><h3>Who are they?</h3><div class="field"><label>Name *</label><input id="name" placeholder="e.g. [Birthday Name]"></div><div class="field"><label>Nickname(s)</label><input id="nick" placeholder="e.g. Sunshine, Bestie, Bro"><div id="nickchips" class="chips" style="margin-top:8px"></div></div><div class="grid2"><div class="field"><label>Relationship</label><select id="rel">${REL.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Gender</label><select id="gender"><option value="">Prefer not to specify</option><option>Male</option><option>Female</option><option>Other</option></select></div></div><div class="field" id="customRelWrap" style="display:none"><label>Custom relationship</label><input id="customRel" placeholder="e.g. favorite human"></div></section>
<section class="stepview"><div class="tiny">STEP 2 OF 5</div><h3>How should it feel?</h3><div class="field"><label>Language mode(s)</label><div class="chips" id="langs">${[['en','🇬🇧 English'],['hi','🇮🇳 Hindi'],['hing','💬 Hinglish']].map(x=>`<button class="chip ${f.langs.includes(x[0])?'on':''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="field"><label>Personality / tone</label><div class="chips" id="tones">${TONES.map(t=>`<button class="chip ${f.tones.includes(t)?'on':''}" data-v="${esc(t)}">${t}</button>`).join('')}</div></div></section>
<section class="stepview"><div class="tiny">STEP 3 OF 5</div><h3>Give it their little sparkle ✨</h3><div class="field"><label>Favourite emojis</label><div class="emoji-grid" id="emojis">${EMOJIS.map(e=>`<button class="emoji ${f.emojis.includes(e)?'on':''}" data-v="${e}">${e}</button>`).join('')}</div></div><div class="field"><label>✍️ Custom emojis</label><input id="customEmoji" placeholder="Paste your own: 🫧 🧸 🫶🏻"></div></section>
<section class="stepview"><div class="tiny">STEP 4 OF 5</div><h3>Optional little memories 📸</h3><p class="sub">Nothing here is required. A blank space is completely okay.</p><div class="grid2"><div class="field"><label>Birthday person's photo</label><div class="upload"><input type="file" id="p1" accept="image/*"><div class="crop-note">Square 1:1 crop • you can adjust it after choosing.</div></div></div><div class="field"><label>Your photo</label><div class="upload"><input type="file" id="p2" accept="image/*"><div class="crop-note">Square 1:1 crop • you can adjust it after choosing.</div></div></div></div><div class="grid2"><div class="field"><label>Birthday date</label><input id="date" type="date"></div><div class="field"><label>Age (optional)</label><input id="age" type="number" min="1" max="120" placeholder="e.g. 18"></div></div></section>
<section class="stepview"><div class="tiny">STEP 5 OF 5</div><h3>The tiny things that make it personal.</h3><div class="grid2"><div class="field"><label>Favourite colour</label><input id="colour" placeholder="e.g. lavender"></div><div class="field"><label>Favourite animal</label><input id="animal" placeholder="e.g. cat"></div><div class="field"><label>Favourite hobby</label><input id="hobby" placeholder="e.g. gaming"></div><div class="field"><label>Favourite song</label><input id="song" placeholder="Song title / artist"></div></div><div class="field"><label>Is there something you want to say yourself?</label><textarea id="message" placeholder="Write it in your own words… line breaks and emojis are kept."></textarea></div></section></div><div class="navbuttons"><button class="btn soft" id="back" disabled>← Back</button><button class="btn primary" id="next">Continue →</button></div></div>`;document.body.append(m);const views=$$('.stepview');const prog=$('#prog');const update=()=>{views.forEach((v,i)=>v.classList.toggle('active',i===step));prog.style.width=((step+1)/views.length*100)+'%';$('#back').disabled=step===0;$('#next').textContent=step===views.length-1?'✨ Create the wish':'Continue →'};update();m.querySelector('.close').onclick=()=>{m.remove();document.body.classList.remove('modal-open')};$('#back').onclick=()=>{if(step>0){step--;update();}};$('#rel').onchange=e=>$('#customRelWrap').style.display=e.target.value==='Other'?'block':'none';$('#nick').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){f.nicknames.push(e.target.value.trim());e.target.value='';renderNick()}});function renderNick(){$('#nickchips').innerHTML=f.nicknames.map((n,i)=>`<button class="chip on" data-i="${i}">${esc(n)} ×</button>`).join('');$$('#nickchips .chip').forEach(b=>b.onclick=()=>{f.nicknames.splice(+b.dataset.i,1);renderNick()})}$$('#langs .chip').forEach(b=>b.onclick=()=>{$$('#langs .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.langs=[b.dataset.v]});$$('#tones .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');f.tones=$$('#tones .chip.on').map(x=>x.dataset.v)});$$('#emojis .emoji').forEach(b=>b.onclick=()=>{b.classList.toggle('on');f.emojis=$$('#emojis .emoji.on').map(x=>x.dataset.v)});const cropped={p1:null,p2:null};let cropBusy=false;const bindPhotoCrop=(id,label)=>{const input=$('#'+id);if(!input)return;input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file){cropped[id]=null;return}if(cropBusy)return;cropBusy=true;input.disabled=true;try{const result=await cropImage(file);cropped[id]=result;if(result){input.dataset.cropped='1';input.closest('.upload').querySelector('.crop-note').textContent='✓ Crop saved • you can choose another photo anytime.';toast(label+' crop saved ✨')}else{input.value='';input.dataset.cropped='';input.closest('.upload').querySelector('.crop-note').textContent='Square 1:1 crop • you can adjust it after choosing.'}}catch{cropped[id]=null;input.value='';toast('Could not open that image. Please choose another one.')}finally{input.disabled=false;cropBusy=false}})};bindPhotoCrop('p1',"Birthday person's photo");bindPhotoCrop('p2','Your photo');let busy=false;$('#next').onclick=async()=>{if(busy)return;busy=true;const btn=$('#next');btn.disabled=true;try{if(step===0){f.name=$('#name').value.trim();if(!f.name)return toast('We need their name first 🌷');f.rel=$('#rel').value;f.gender=$('#gender').value;f.customRel=$('#customRel').value.trim()}if(step===1){}if(step===2)f.customEmoji=$('#customEmoji').value.trim();if(step===3){f.photos=[];if(cropped.p1)f.photos.push({src:cropped.p1,label:'for you'});if(cropped.p2)f.photos.push({src:cropped.p2,label:'a little memory'});f.date=$('#date').value;f.age=$('#age').value}if(step===4){f.colour=$('#colour').value.trim();f.animal=$('#animal').value.trim();f.hobby=$('#hobby').value.trim();f.song=$('#song').value.trim();f.message=$('#message').value;if(!f.message&&f.tones.includes('Emotional 💖')){}const payload={...f,created:Date.now()};const share=await saveWish(payload);m.innerHTML=`<div class="sheet"><div style="text-align:center"><div class="eyebrow">🌷 IT’S READY</div><h2 style="font-family:'Playfair Display';font-size:42px;margin:18px 0 8px">Your wish is ready!</h2><p class="sub">Send this little key to the birthday person. Their side will open directly into the surprise.</p><div class="sharebox"><b>🔐 Share Token</b><div class="mono share-token" id="shareCode">${share.code}</div></div><div class="sharebox"><b>🔗 Shareable Link</b><div class="mono" id="shareLink">${share.url}</div><div class="tiny" style="margin-top:8px">The link is the easiest way to share. The token is an offline copy of the same wish data.</div></div><div class="actions"><button class="btn soft" id="copyCode">📋 Copy Token</button><button class="btn soft" id="copyLink">🔗 Copy Link</button><button class="btn pink" id="share">📱 Share</button></div><div style="margin-top:18px"><button class="btn primary" id="openPreview">Preview the recipient experience →</button></div><p class="tiny" style="margin-top:18px">Best option: use Copy Link or Share. The link keeps the wish inside the URL, so the recipient does not need an account or database.</p></div></div>`;$('#copyCode').onclick=()=>navigator.clipboard?.writeText(share.code).then(()=>toast('Share token copied ✨'));$('#copyLink').onclick=()=>navigator.clipboard?.writeText(share.url).then(()=>toast('Link copied 🔗'));$('#share').onclick=()=>navigator.share?navigator.share({title:'A little birthday surprise 🌸',url:share.url}):toast('Your browser does not support native sharing. Copy the link instead.');$('#openPreview').onclick=()=>{m.remove();document.body.classList.remove('modal-open');renderRecipient(payload)};return}step++;update()}finally{busy=false;btn.disabled=false}};}
function relationshipIntro(f){const r=f.rel;if(r==='Sister')return `Happy Birthday, ${f.name}! 🎂✨`;if(r==='Brother')return `Happy Birthday, ${f.name}! 🎂✨`;if(r==='Best Friend')return `Happy Birthday to one of my favourite people, ${f.name}. 💗`;if(r==='Friend')return `Happy Birthday, ${f.name}! 🌷`;if(['Boyfriend','Girlfriend','Partner','Wife','Husband'].includes(r))return `Happy Birthday to someone who makes ordinary days feel a little brighter, ${f.name}. 💗`;if(r==='Crush')return `Happy Birthday, ${f.name}! ✨`;if(['Mother','Father'].includes(r))return `Happy Birthday, ${f.name}. 🌷`;if(r==='Cousin')return `Happy Birthday, ${f.name}! 🎂`;return `Happy Birthday, ${f.name}! ✨`}
function makeParagraphs(f){const hobby=f.hobby?` And I hope you still make plenty of time for ${f.hobby} along the way.`:'';const fun=f.tones.includes('Funny 😂')||f.tones.includes('Playful 😭')||f.tones.includes('Best-friend chaos 🤡');return [relationshipIntro(f),`I hope this year gives you more of the things that quietly make life good — random laughs, peaceful evenings, good conversations, little wins, and people around whom you never have to pretend. 🌷${hobby}`,fun?`Also, please remember that birthdays are basically a free pass to accept every compliment, claim the best piece of cake, and be a little dramatic for no reason. 😭🤌🏻`:`And for today, I hope you let yourself enjoy being celebrated. You don't have to do anything extraordinary to deserve a day full of warmth, happiness and people who are genuinely glad you're here. 💗`,`Whatever this next year brings, I hope you keep choosing the things that make you feel like yourself. Keep the people who feel like home close, make memories you’ll want to keep, and be a little kinder to yourself on the ordinary days too. Here’s to a beautiful year ahead. ✨🌸`]}
function hindi(f){const hobby=f.hobby?` और तुम्हें ${f.hobby} के लिए भी खूब समय मिले।`:'';return [`जन्मदिन की बहुत-बहुत शुभकामनाएँ, ${f.name}! 🎂✨`,`दिल से बस यही दुआ है कि आने वाला साल तुम्हारे लिए सुकून, हँसी, अच्छे लोगों और ऐसी छोटी-छोटी खुशियों से भरा रहे, जिन्हें याद करके बाद में भी चेहरे पर मुस्कान आ जाए। 🌷${hobby}`,`आज के दिन बस इतना याद रखना कि तुम्हें हर चीज़ perfect करने की ज़रूरत नहीं है। अपने लोगों के साथ रहो, खूब हँसो, अच्छा खाना खाओ और इस पूरे दिन को अपने तरीके से enjoy करो। 💗`,`आने वाला साल जैसा भी हो, उम्मीद है तुम अपने सपनों के लिए आगे बढ़ते रहो और रास्ते में खुद के लिए भी थोड़ा समय निकालते रहो। जो लोग तुम्हें सच्चे दिल से खुश देखना चाहते हैं, उन्हें पास रखना — और अपनी छोटी-छोटी जीतों को भी celebrate करना। ✨🌸`]}
function hinglish(f){const hobby=f.hobby?` Aur haan, ${f.hobby} ke liye bhi proper time milta rahe — woh bhi important hai.`:'';return [`Happy Birthday, ${f.name}! 🎂✨ Aaj ka din genuinely tumhare naam hai — so please smile a little extra, cake enjoy karo aur jo cheezein tumhe actually happy banati hain, unke liye time nikalo.`,`I hope ye saal tumhare liye thoda softer, happier aur peaceful ho. Aise random moments milte rahein jo bina plan ke bhi yaad reh jaayein, achhe log aas-paas rahein, aur chhoti-chhoti wins bhi dil ko genuinely khush karein. 🌷${hobby}`,`Aaj overthinking ko chhutti do. Compliments accept karo, cake ka best piece le lo, photos kheecho aur bas enjoy karo — birthday ko unnecessarily serious banane ki koi zaroorat nahi. 😭🤌🏻`,`Aur ek baat: tumhe har waqt kuch prove karne ki zaroorat nahi hai. Jo log tumhe genuinely khush dekhna chahte hain, unhe close rakho; apne liye bhi thoda time rakho; aur jo achha hai usse feel karna mat bhoolna. I hope next chapter tumhare liye beautiful memories se full ho. ✨💗`]}

function wishText(f){const l=(f.langs&&f.langs[0])||'en';return l==='hi'?hindi(f):l==='hing'?hinglish(f):makeParagraphs(f)}
const COPY={en:{eyebrow:'🌸 There’s a little surprise waiting here',intro:'You found it. Now let’s see if you can unlock it. 👀',initial:'Three tiny games. No pressure, just a little birthday fun.',mini:'TINY BIRTHDAY GAMES',greeting:'Happy Birthday,',continue:'Let’s play →',games:{tap:{title:'Catch the little wishes 💗',sub:'Tap 5 hearts before they disappear. Easy start.',success:'Okayyy, you’ve got quick fingers. ✨'},memory:{title:'A tiny memory match 📸',sub:'Flip the cards and find all three matching pairs.',success:'Three pairs. Not bad at all. 🌷'},timing:{title:'Make the wish land ✨',sub:'Tap when the little dot reaches the soft pink zone.',success:'Perfect timing. Make that wish. 🎂'}},readyEyebrow:'Okay… you unlocked it ✨',readyTitle:'There’s something here that was made just for you.',readyText:'Take a tiny breath, then open the birthday surprise.',openSurprise:'🎁 Open my surprise',wrong:'Not quite — try again 💗'},hi:{eyebrow:'🌸 यहाँ तुम्हारे लिए एक छोटा-सा सरप्राइज़ है',intro:'मिल गया। अब इसे unlock भी करना है। 👀',initial:'बस तीन छोटी-सी games हैं — आराम से खेलो, कोई pressure नहीं।',mini:'छोटी-सी BIRTHDAY GAMES',greeting:'जन्मदिन की बहुत-बहुत शुभकामनाएँ,',continue:'चलो खेलते हैं →',games:{tap:{title:'छोटी-छोटी खुशियाँ पकड़ो 💗',sub:'5 hearts को tap करो, फिर अगला पल तुम्हारा।',success:'अरे वाह, speed तो अच्छी है। ✨'},memory:{title:'एक छोटी-सी memory match 📸',sub:'Cards पलटो और तीनों matching pairs ढूँढो।',success:'तीनों pairs मिल गए। 🌷'},timing:{title:'Wish को सही जगह पहुँचाओ ✨',sub:'जब dot गुलाबी हिस्से में आए, तब tap करना।',success:'Perfect! अब wish करने का time है। 🎂'}},readyEyebrow:'अच्छा… unlock हो गया ✨',readyTitle:'तुम्हारे लिए कुछ सच में प्यारा-सा रखा है।',readyText:'एक छोटी-सी सांस लो, फिर अपना birthday surprise खोलो।',openSurprise:'🎁 मेरा surprise खोलो',wrong:'अभी नहीं — फिर से try करो 💗'},hing:{eyebrow:'🌸 Yahan tumhare liye ek little surprise hai',intro:'Mil gaya. Ab isse unlock bhi karna hai. 👀',initial:'Bas three tiny games hain — chill, koi pressure nahi.',mini:'TINY BIRTHDAY GAMES',greeting:'Happy Birthday,',continue:'Chalo khelte hain →',games:{tap:{title:'Little wishes catch karo 💗',sub:'5 hearts ko tap karo before they fade.',success:'Okayyy, reflexes toh solid hain. ✨'},memory:{title:'Ek tiny memory match 📸',sub:'Cards flip karo aur three matching pairs find karo.',success:'Teen pairs mil gaye. Nice. 🌷'},timing:{title:'Wish ko perfect timing do ✨',sub:'Dot ko pink zone mein aate hi tap karna.',success:'Perfect timing. Ab wish banti hai. 🎂'}},readyEyebrow:'Okay… unlock ho gaya ✨',readyTitle:'Tumhare liye kuch genuinely special wait kar raha hai.',readyText:'Ek tiny breath lo, phir apna birthday surprise open karo.',openSurprise:'🎁 Mera surprise kholo',wrong:'Close — ek baar aur try karo 💗'}};
function langCopy(f){return COPY[(f.langs&&f.langs[0])||'en']||COPY.en}
function renderRecipient(f){const L=langCopy(f),l=(f.langs&&f.langs[0])||'en';document.title=`A little surprise for ${f.name} · WishBloom`;const emojis=(f.emojis||['✨','💗','🎂']).concat((f.customEmoji||'').split(/\s+/).filter(Boolean));const safeEmoji=emojis.length?emojis:['✨'];$('#app').innerHTML=`<div class="recipient">${controlsHTML(l)}<div class="floaters">${safeEmoji.slice(0,8).map((e,i)=>`<span class="floater" style="left:${8+i*11}%;animation-delay:${i*.8}s">${e}</span>`).join('')}</div><div id="stage" class="rec-stage"><div class="stage-card"><div class="eyebrow">${L.eyebrow}</div><h2 id="stageTitle">${L.intro}</h2><p id="stageText">${L.initial}</p><button class="btn primary" id="stageBtn">${L.continue}</button></div></div></div>`;bindControls();startMusic();let gameIndex=0;const stage=()=>{if(gameIndex===0){$('#stageTitle').textContent=L.intro;$('#stageText').textContent=L.initial;$('#stageBtn').textContent=L.continue;$('#stageBtn').onclick=()=>{clickSound(520,.1);gameIndex=1;playTapGame()}}};function done(msg,next){$('#gn').textContent=msg;celebrateSmall();setTimeout(next,650)}function playTapGame(){const g=L.games.tap;$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 1/3</div><h2>${g.title}</h2><p>${g.sub}</p><div class="game-progress" id="gp">0 / 5</div><div class="game-board" id="tapBoard"></div><div class="game-note" id="gn"></div></div>`;const board=$('#tapBoard');let score=0,timer=null;const spawn=()=>{board.querySelector('.tap-heart')?.remove();const h=document.createElement('button');h.className='tap-heart';h.textContent=safeEmoji[score%safeEmoji.length]||'💗';h.style.left=(14+Math.random()*72)+'%';h.style.top=(18+Math.random()*64)+'%';board.append(h);h.onclick=()=>{score++;clickSound(620+score*55,.08);$('#gp').textContent=`${score} / 5`;sparkleAt(h);h.remove();if(score>=5){clearTimeout(timer);done(g.success,playMemoryGame)}else{timer=setTimeout(spawn,900)}};timer=setTimeout(spawn,180)};spawn()}
function playMemoryGame(){const g=L.games.memory;const symbols=['🌸','⭐','💗','🌸','⭐','💗'].sort(()=>Math.random()-.5);$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 2/3</div><h2>${g.title}</h2><p>${g.sub}</p><div class="memory-grid" id="memoryGrid"></div><div class="game-note" id="gn"></div></div>`;const grid=$('#memoryGrid');let first=null,lock=false,matches=0;symbols.forEach((sym,i)=>{const b=document.createElement('button');b.className='memory-card';b.dataset.sym=sym;b.innerHTML='<span>✨</span>';b.onclick=()=>{if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');b.innerHTML=`<span>${sym}</span>`;clickSound(500,.07);if(!first){first=b;return}if(first.dataset.sym===sym){first.classList.add('matched');b.classList.add('matched');first=null;matches++;clickSound(760,.12);if(matches===3)done(g.success,playTimingGame)}else{lock=true;setTimeout(()=>{first.classList.remove('flipped');b.classList.remove('flipped');first.innerHTML='<span>✨</span>';b.innerHTML='<span>✨</span>';first=null;lock=false},520)}};grid.append(b)})}
function playTimingGame(){const g=L.games.timing;$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 3/3</div><h2>${g.title}</h2><p>${g.sub}</p><div class="timing-wrap"><div class="timing-track"><div class="timing-zone"></div><div class="timing-marker" id="tm"></div></div></div><button class="btn pink" id="timingBtn">✨ ${l==='hi'?'अब tap करो':l==='hing'?'Ab tap karo':'Tap now'}</button><div class="game-note" id="gn"></div></div>`;const marker=$('#tm'),btn=$('#timingBtn');let x=0,dir=1,last=performance.now(),running=true;const loop=(now)=>{if(!running)return;const dt=Math.min(32,now-last);last=now;x+=dir*dt*.11;if(x>100){x=100;dir=-1}if(x<0){x=0;dir=1}marker.style.left=x+'%';requestAnimationFrame(loop)};requestAnimationFrame(loop);btn.onclick=()=>{running=false;const good=x>=38&&x<=62;if(good){clickSound(820,.18);done(g.success,revealPrep)}else{clickSound(190,.1);$('#gn').textContent=L.wrong}}}
function revealPrep(){$('#stage').innerHTML=`<div class="stage-card"><div class="eyebrow">${L.readyEyebrow}</div><h2>${L.readyTitle}</h2><p>${L.readyText}</p><button class="btn pink" id="open">${L.openSurprise}</button></div>`;$('#open').onclick=()=>reveal(f,safeEmoji)}stage();}

function celebrateSmall(){if(!state.sound)return;clickSound(720,.07);setTimeout(()=>clickSound(880,.09),70)}function celebrationSound(){if(!state.sound||!audioReady())return;[523.25,659.25,783.99,1046.5].forEach((freq,i)=>setTimeout(()=>clickSound(freq,.16),i*85))}function sparkleAt(el){const r=el.getBoundingClientRect();for(let i=0;i<4;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','💗','🌸','⭐'][i];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',((Math.random()*100)-50)+'px');s.style.setProperty('--dy',((Math.random()*100)-50)+'px');document.body.append(s);setTimeout(()=>s.remove(),950)}}function burst(){const count=window.innerWidth<700?42:72;for(let i=0;i<count;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=`hsl(${Math.random()*360},75%,70%)`;c.style.transform=`rotate(${Math.random()*360}deg)`;document.body.append(c);setTimeout(()=>c.remove(),2800)}['🎈','🎈','🎉','🎊'].forEach((e,i)=>{const b=document.createElement('div');b.className='balloon';b.textContent=e;b.style.left=(12+i*24)+'%';b.style.setProperty('--x',(Math.random()*100-50)+'px');document.body.append(b);setTimeout(()=>b.remove(),5200)});for(let i=0;i<10;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','💗','🌸'][i%3];s.style.left=(10+Math.random()*80)+'%';s.style.top=(20+Math.random()*55)+'%';s.style.setProperty('--dx',((Math.random()*100)-50)+'px');s.style.setProperty('--dy',((Math.random()*120)-60)+'px');document.body.append(s);setTimeout(()=>s.remove(),950)}}
function reveal(f,safeEmoji){burst();celebrationSound();const L=langCopy(f);setTimeout(()=>{const l=(f.langs&&f.langs[0])||'en';const ps=wishText(f);const wish=ps.map(p=>`<p>${esc(p)}</p>`).join('');const wishes=l==='hi'?['तुम्हारी ज़िंदगी में हमेशा ऐसी वजहें रहें जिनके लिए दिल से शुक्रिया कहा जा सके। 🌷','जो लोग तुम्हें अपना-सा महसूस कराते हैं, वे हमेशा तुम्हारे पास रहें। 💗','तुम जो चाहो, उसकी तरफ धीरे-धीरे लेकिन पूरे दिल से बढ़ते रहो। ✨','इस साल तुम्हें बहुत सारी छोटी खुशियाँ मिलें — और उन्हें notice करने का समय भी मिले। 🌸','और सबसे ज़रूरी, खुद के लिए भी उतनी ही नरमी रखना जितनी तुम अपने लोगों के लिए रखते हो। 🤍']:l==='hing'?['Life mein hamesha aise moments milte rahein jinke liye dil se grateful feel ho. 🌷','Jo log tumhe genuinely apna feel karvate hain, woh tumhare close rahein. 💗','Jo cheezein tumhe excite karti hain, unke peeche jaana aur apni pace par grow karna kabhi mat chhodna. ✨','Is saal ki chhoti wins ko bhi celebrate karna — har good thing ko huge reason ki zaroorat nahi hoti. 🌸','Aur haan, khud ke saath bhi thoda soft rehna. Tum uske bhi deserve karte ho. 🤍']:['May life keep giving you little reasons to feel grateful, even on the most ordinary days. 🌷','May the people who feel like home stay close, and may you always have someone to laugh with. 💗','May you keep moving toward the things that make you feel excited, proud and genuinely yourself. ✨','May this year bring you small wins worth celebrating, peaceful moments worth keeping, and memories that arrive when you least expect them. 🌸','And through all of it, I hope you remember to be as kind to yourself as you are to the people you love. 🤍'];const wishlets=wishes.map((w,i)=>`<div class="wishlet">${safeEmoji[i%safeEmoji.length]} ${w}</div>`).join('');const photoLabels=l==='hi'?['तुम्हारे लिए','एक प्यारी-सी याद']:l==='hing'?['Tumhare liye','Ek little memory']:['for you','a little memory'];const photos=(f.photos||[]).map((p,i)=>`<div class="photo"><img src="${p.src}" alt="${photoLabels[i%photoLabels.length]}"><small>${esc(p.label||photoLabels[i%photoLabels.length])} ✨</small></div>`).join('');const photoBlock=photos?`<section class="photo-grid">${photos}</section>`:'';const messageBlock=f.message?`<section class="card" style="max-width:780px;margin:25px auto;text-align:left"><div class="tiny">${l==='hi'?'एक छोटी-सी बात…':l==='hing'?'Ek little si baat…':'ONE LITTLE NOTE…'}</div><h2 style="font-family:'Playfair Display'">💌 ${l==='hi'?'तुम्हारे लिए':l==='hing'?'Tumhare liye':'For you'}</h2><p style="white-space:pre-wrap;line-height:1.85">${esc(f.message)}</p></section>`:'';const endTitle=l==='hi'?'इस छोटे-से पल को अपने पास रखना। 🌸':l==='hing'?'Is little moment ko apne paas rakhna. 🌸':'Keep this little moment somewhere close. 🌸';const endText=l==='hi'?'कभी बाद में इस दिन को याद करो, तो उम्मीद है तुम्हें आज की हँसी, अपने लोगों की बातें और ये छोटी-सी खुशी भी याद आए।':l==='hing'?'Kabhi baad mein is din ko yaad karo, toh hope hai aaj ki smile, apne logon ki baatein aur ye little happiness bhi yaad aaye.':'When you look back on this day someday, I hope you remember the laughter, the little details, and how loved you were in this moment.';const finalChapter=l==='hi'?'तुम्हारा अगला chapter बहुत खूबसूरत हो। ✨':l==='hing'?'Tumhara next chapter genuinely beautiful ho. ✨':'May the next chapter of your life be gentle, exciting and beautifully yours. ✨';const outLabel=l==='hi'?'सरप्राइज़ खुल गया':l==='hing'?'Surprise unlocked':'the surprise is yours';const today=l==='hi'?'आज का दिन तुम्हारे लिए थोड़ा और खूबसूरत हो।':l==='hing'?'Aaj ka din tumhare liye thoda aur special ho.':'I hope today feels a little more special than an ordinary day.';const more=l==='hi'?'तुम्हारे लिए कुछ और छोटी wishes…':l==='hing'?'Tumhare liye kuch aur little wishes…':'A few more little wishes for you…';const lastTitle=l==='hi'?'अभी एक आखिरी छोटी-सी चीज़ बाकी है। 👀':l==='hing'?'Abhi ek last little thing baaki hai. 👀':'There’s one last little thing waiting for you. 👀';const lastText=l==='hi'?'नीचे वाला button दबाओ — फिर ये आखिरी moment बस तुम्हारा है।':l==='hing'?'Neeche wala button dabao — phir ye last moment bas tumhara hai.':'Press the button below, then keep this last little moment for yourself.';const lastBtn=l==='hi'?'आखिरी चीज़ खोलो':l==='hing'?'One last thing kholo':'Open the last little thing';const homeTitle=l==='hi'?'अब आपकी बारी? 💌':l==='hing'?'Ab tumhari baari? 💌':'Want to make someone’s birthday special too? 💌';const homeText=l==='hi'?'अब आप भी किसी अपने के लिए एक छोटा-सा WishBloom बना सकते हैं।':l==='hing'?'Ab tum bhi kisi apne ke liye ek little WishBloom bana sakte ho — just because.':'Make a little birthday moment for someone you care about. No big reason needed. Just a little surprise.';const homeBtn=l==='hi'?'अपना WishBloom बनाओ →':l==='hing'?'Apna WishBloom banao →':'Make a WishBloom →';const app=document.createElement('div');app.className='recipient';app.innerHTML=`${controlsHTML(l)}<main class="container reveal"><div class="eyebrow">🎉 ${outLabel}</div><h1>${L.greeting}<br><span style="background:linear-gradient(100deg,#d95f91,#8f75d7);-webkit-background-clip:text;color:transparent">${esc(f.name)}!</span> 🎂</h1><p class="sub">${today}</p><section class="wish card">${wish}</section>${photoBlock}<section class="card" style="max-width:780px;margin:25px auto;text-align:left"><h2 style="font-family:'Playfair Display';margin-top:0">🌷 ${more}</h2><div class="wishes">${wishlets}</div></section>${messageBlock}<section class="last"><div class="card"><div class="tiny">${l==='hi'?'आखिरी छोटी-सी बात':l==='hing'?'ONE LAST LITTLE THING':'ONE LAST THING'}</div><h2 style="font-family:'Playfair Display'">${lastTitle}</h2><p class="sub">${lastText}</p><button class="btn primary" id="lastBtn">🎁 ${lastBtn}</button><div class="last-content" id="lastContent"><h2 style="font-family:'Playfair Display'">${endTitle}</h2><p class="sub">${endText}</p><p style="font-family:'Playfair Display';font-size:24px">${finalChapter}</p><div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--line)"><strong>Created by Shivaayu</strong><br><span class="tiny">made with love ♡</span><div style="margin-top:9px"><a href="https://instagram.com/Pvt_Shivaayu" target="_blank" rel="noopener">@Pvt_Shivaayu</a> · <a href="https://instagram.com/Selfish_Senpaiii" target="_blank" rel="noopener">@Selfish_Senpaiii</a></div></div></div></div></section><section class="home-cta"><div class="card"><div class="eyebrow">🌸 ${homeTitle}</div><p class="sub">${homeText}</p><button class="btn pink" id="homeCta">${homeBtn}</button></div></section></main>`;$('#app').replaceChildren(app);bindControls();startMusic();$('#lastBtn').onclick=()=>{$('#lastContent').classList.add('show');$('#lastBtn').style.display='none';burst();celebrationSound();setTimeout(()=>$('#lastContent').scrollIntoView({behavior:'smooth',block:'center'}),50)};$('#homeCta').onclick=()=>{history.pushState({},'',location.pathname);renderHome();window.scrollTo(0,0)}} ,250)}
async function route(){const q=new URLSearchParams(location.search);const h=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'') );const id=h.get('wish')||q.get('wish');if(id){$('#app').innerHTML='<div class="loading"><div class="spinner"></div></div>';const data=await unpack(id);if(data&&data.name){renderRecipient(data)}else{$('#app').innerHTML=`<main class="container" style="min-height:100vh;display:grid;place-items:center;text-align:center"><div class="card"><div class="eyebrow">🔐 Hmm…</div><h1 style="font-family:'Playfair Display'">This WishBloom link is incomplete.</h1><p class="sub">Please copy the complete link again from the sender. If it was sent through a chat app, make sure the whole link is included.</p><button class="btn primary" onclick="history.pushState({},'',location.pathname);location.hash='';renderHome()">← Back to WishBloom</button></div></main>`}}else renderHome()}
route();
</script></body></html>
